name: glyph_det
description: "Mask-conditioned glyph detection plugin for Flutter (ncnn + Vulkan). Locates a queried pickup code in the live camera frame and reports its bounding box."
version: 0.1.0
publish_to: "none"

environment:
  sdk: ^3.8.1
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.luonnotar.glyphdet
        pluginClass: GlyphDetPlugin
